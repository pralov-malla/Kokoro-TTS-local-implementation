[project]
name = "kokoro-tts-local-implementation"
version = "0.1.0"
description = "Implementing kokoro-tts locally using NVIDIA GeForce GTX 1650"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "huggingface-hub>=1.8.0",
    "kokoro>=0.9.4",
    "openai>=2.32.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.2",
    "soundfile>=0.13.1",
    "stable-ts>=2.19.1",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    "torchvision>=0.22.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
